# CI on every pull request to main and every push to main, and by hand
# (workflow_dispatch). Two jobs, each a check the ruleset on main
# requires (D44):
#
#   lint and self-tests (D43): lint, the lint and hooks self-tests, and
#     the context index check, in the ubuntu:26.04 container so gcc and
#     cppcheck are the same releases as on the laptop (D42).
#   build and boot (D46-D49): builds the image with Buildroot and boots
#     it with scripts/run.sh under KVM and TCG. It passes in seconds
#     when nothing build-relevant changed (scripts/ci-changes.sh).
#
# Protected like the lint scripts (D34): a weakened workflow is a way
# around the lint and the boot test.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Read-only and no secrets, so pull requests from forks are safe.
permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main
# always finish, so every commit on main gets a result.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: lint and self-tests
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 15
    steps:
      # Before checkout, so checkout finds git and makes a real clone
      # (lint lists files with git ls-files).
      - name: Install tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git gcc libc6-dev cppcheck perl python3 curl ca-certificates

      - name: Check out
        uses: actions/checkout@v7

      # The container runs as root over a workspace owned by the runner's
      # user, so git needs to be told the checkout is safe.
      # lint-selftest.sh refuses to run unless the repo's hooks are on.
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config core.hooksPath .githooks

      - name: Fetch checkpatch
        run: scripts/fetch-checkpatch.sh

      - name: Lint
        run: scripts/lint.sh

      - name: Lint self-test
        run: scripts/lint-selftest.sh

      - name: Hooks self-test
        run: scripts/hooks-selftest.sh

      - name: Context index is current
        run: scripts/context_index.py --check

  build:
    name: build and boot
    # On the runner itself, not in a container: it matches the cluster's
    # Ubuntu 24.04, and the boots need /dev/kvm (D46).
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    # actions: read lets the decide step look up earlier passes (D56).
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        # bash -eo pipefail, so a failure inside a pipe fails the step.
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # All history, so the change check can find the merge base.
          fetch-depth: 0

      # The job always runs, because a required check that never runs
      # leaves a pull request unmergeable; this step decides how much of
      # the rest does (D56), as one of three modes:
      #   skip   nothing to test: no change to the image or the boot test,
      #          or this exact image and boot test already passed
      #   boot   the image's inputs match an image an earlier run built
      #          and passed: boot that image again, without building
      #   build  build the image, then boot it
      # scripts/ci-changes.sh compares a pull request from its merge base
      # with the base branch, a push to main with the previous head, and
      # says build, boot or skip. Earlier passes are found by fingerprint
      # (of the commit under test: the merge commit, for a pull request)
      # among the pass markers runs on this repository uploaded, never a
      # fork's. A manual run always builds, and so does anything in doubt.
      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case $EVENT in
          pull_request) base=$PR_BASE head=$PR_HEAD ;;
          push) base=$PUSH_BEFORE head=$GITHUB_SHA ;;
          *) base= head=$GITHUB_SHA ;;
          esac
          out=$RUNNER_TEMP/changes.txt err=$RUNNER_TEMP/changes.err
          rc=0
          scripts/ci-changes.sh "$base" "$head" >"$out" 2>"$err" || rc=$?
          cat "$out" "$err"
          verdict=$(head -n 1 "$out")
          case $verdict in skip | boot | build) ;; *) verdict=build ;; esac
          if [ $rc -ne 0 ] || [ "$EVENT" = workflow_dispatch ]; then
            verdict=build
          fi

          # A failed fingerprint or lookup finds no pass: it builds.
          fps=$(scripts/ci-changes.sh --fingerprint HEAD) || fps=
          read -r image_fp boot_fp <<<"$fps" || true
          mode=$verdict passed= reuse=
          if [ "$verdict" != skip ] && [ "$EVENT" != workflow_dispatch ] &&
            [ -n "$image_fp" ] && [ -n "$boot_fp" ]; then
            # Passes of this image, newest first, as "<boot fp> <run id>".
            prefix=build-and-boot-passed-$image_fp-
            markers=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.expired | not)
                | select(.workflow_run.head_repository_id == .workflow_run.repository_id)
                | select(.name | startswith(\"$prefix\"))
                | \"\(.name | ltrimstr(\"$prefix\")) \(.workflow_run.id)\"") || markers=
            passed=$(awk -v b="$boot_fp" '$1 == b { print $2; exit }' <<<"$markers")
            reuse=$(awk 'NF == 2 { print $2; exit }' <<<"$markers")
            if [ -n "$passed" ]; then
              mode=skip
            elif [ -n "$reuse" ]; then
              mode=boot
            else
              mode=build
            fi
          fi
          echo "verdict: $verdict; mode: $mode; image $image_fp, boot $boot_fp;" \
            "passed in: ${passed:-none}; image from: ${reuse:-none}"
          {
            echo "mode=$mode"
            echo "image_fp=$image_fp"
            echo "boot_fp=$boot_fp"
            echo "reuse=$reuse"
          } >>"$GITHUB_OUTPUT"
          runs=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs
          {
            if [ -n "$passed" ]; then
              echo "This image and boot test already passed in run" \
                "[$passed]($runs/$passed); build and boot skipped."
            elif [ "$mode" = skip ]; then
              echo "No change to the image or the boot test; build and boot skipped."
            elif [ "$mode" = boot ]; then
              echo "The image's inputs match the image run [$reuse]($runs/$reuse)" \
                "built and passed; booting that image again, without building."
            elif [ "$EVENT" = workflow_dispatch ]; then
              echo "Manual run; building."
            else
              echo "The image's inputs changed, or no earlier run passed this image; building."
            fi
            echo
            echo "Fingerprints: image \`${image_fp:-none}\`, boot \`${boot_fp:-none}\`"
            if [ $rc -ne 0 ]; then
              echo
              echo "scripts/ci-changes.sh exited $rc: $(cat "$err")"
            fi
            echo
            echo "Changed paths (base \`${base:-none}\`, head \`$head\`):"
            echo
            echo '```'
            tail -n +2 "$out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The build needs about 11 GB for buildroot/output and dl (README).
      # Below 20 GB free, remove preinstalled SDKs WipeOS never uses.
      - name: Free disk space
        id: disk
        if: steps.decide.outputs.mode == 'build'
        run: |
          free_gb() { df --output=avail -BG / | tail -n 1 | tr -dc 0-9; }
          before=$(free_gb)
          if [ "$before" -lt 20 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /usr/local/.ghcup
          fi
          echo "before_gb=$before" >>"$GITHUB_OUTPUT"
          echo "start_gb=$(free_gb)" >>"$GITHUB_OUTPUT"
          echo "free: $before GB, $(free_gb) GB after cleanup"
          if [ "$(free_gb)" -lt 20 ]; then
            echo "::error::only $(free_gb) GB free; the build needs about 11 GB plus headroom"
            exit 1
          fi

      # The distribution's QEMU (D23) for the boots, and for a build,
      # Buildroot's host packages from the README's build-host list.
      # libncurses-dev is left out: it is only for make menuconfig.
      # seabios and ipxe-qemu are QEMU's BIOS and the default network
      # card's boot ROM.
      - name: Install packages
        if: steps.decide.outputs.mode != 'skip'
        env:
          DEBIAN_FRONTEND: noninteractive
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          packages=(qemu-system-x86 seabios ipxe-qemu)
          if [ "$MODE" = build ]; then
            packages+=(build-essential bc bzip2 cpio diffutils file findutils
              gzip patch perl python3 rsync sed tar unzip wget git)
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
          qemu-system-x86_64 --version

      # Boot mode (D56): the image an earlier run built from the same
      # inputs and passed, from that run's bzImage artifact, where run.sh
      # --no-build looks for it.
      - name: Fetch the passed image
        id: fetch
        if: steps.decide.outputs.mode == 'boot'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.decide.outputs.reuse }}
        run: |
          mkdir -p buildroot/output/images
          gh run download "$RUN" -n bzImage -D buildroot/output/images
          ls -l buildroot/output/images/bzImage

      # The version in configs/buildroot.version, as on a build host
      # (D47). The defconfig takes the kernel's hash from that tag.
      - name: Clone Buildroot
        id: br
        if: steps.decide.outputs.mode == 'build'
        run: |
          version=$(cat configs/buildroot.version)
          git clone --depth 1 --branch "$version" \
            https://gitlab.com/buildroot.org/buildroot.git buildroot
          echo "version=$version" >>"$GITHUB_OUTPUT"

      # Downloaded sources only (D47). The prefix restore reuses most of
      # them after a config change; Buildroot checks each file's hash and
      # fetches what's missing.
      - name: Restore downloads
        id: dl
        if: steps.decide.outputs.mode == 'build'
        uses: actions/cache/restore@v6
        with:
          path: buildroot/dl
          key: br-dl-${{ steps.br.outputs.version }}-${{ hashFiles('configs/**', 'package/**') }}
          restore-keys: br-dl-${{ steps.br.outputs.version }}-

      - name: Build
        id: build
        if: steps.decide.outputs.mode == 'build'
        run: |
          mkdir -p logs/ci
          start=$(date +%s)
          rc=0
          (cd buildroot && make BR2_EXTERNAL=.. wipeOS_x86_64_defconfig &&
            make) >logs/ci/build.log 2>&1 || rc=$?
          seconds=$(($(date +%s) - start))
          tail -n 200 logs/ci/build.log >logs/ci/build-tail.log
          echo "seconds=$seconds" >>"$GITHUB_OUTPUT"
          echo "end_gb=$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)" \
            >>"$GITHUB_OUTPUT"
          df -h /
          echo "build: exit $rc after $seconds s"
          if [ $rc -ne 0 ]; then
            tail -n 50 logs/ci/build.log
            exit $rc
          fi
          ls -l buildroot/output/images/bzImage

      # Saved only after a successful build, so an early failure can't
      # store a near-empty dl/ under a key that later runs would then hit
      # and never replace.
      - name: Save downloads
        if: steps.build.outcome == 'success' && steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: buildroot/dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      # The runner has /dev/kvm, but only root and the kvm group may open
      # it. This udev rule opens it to every user, so run.sh finds KVM
      # usable (D39, D48). There is no fallback: if it doesn't work, the
      # kvm boot below fails.
      - name: Enable KVM
        if: steps.build.outcome == 'success' || steps.fetch.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      # Four boots of the image just built or fetched (D48), each forcing
      # its mode so a broken KVM setup can't quietly pass under TCG. Every
      # case runs even if an earlier one failed; the step fails if any
      # case didn't give its expected exit code (D30) and log line.
      - name: Boot
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.fetch.outcome == 'success') }}
        run: |
          results=$RUNNER_TEMP/boots.tsv
          : >"$results"
          failed=0
          # boot CASE WANT_EXIT WANT_LINE RUN_SH_ARGS...
          boot() {
            local name=$1 want=$2 line=$3 rc=0 accel verdict
            shift 3
            local log=logs/ci/$name.log
            echo "::group::$name: scripts/run.sh --no-build --log $log $*"
            scripts/run.sh --no-build --log "$log" "$@" || rc=$?
            echo "::endgroup::"
            accel=$(grep -a -m 1 '^RUN git=' "$log" 2>/dev/null |
              grep -o 'accel=[a-z]*' | cut -d= -f2 || true)
            if [ $rc -eq "$want" ] && grep -aq -- "$line" "$log" 2>/dev/null; then
              verdict=pass
            else
              verdict=fail
              failed=1
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "$name" "${accel:-none}" "$rc" \
              "$want" "$verdict" >>"$results"
            echo "$name: accel=${accel:-none}, exit $rc (want $want): $verdict"
          }
          boot kvm 0 '^RUN git=.* accel=kvm ' --accel kvm
          boot tcg 0 '^RUN git=.* accel=tcg ' --accel tcg
          boot test-fail 1 '^WIPEOS RESULT=FAIL' --test-fail
          boot mem4 0 '^WIPEOS RESULT=SUCCESS' --mem 4
          exit $failed

      # D49: build time, image size and the boot table, on the run's page.
      - name: Summary
        if: ${{ !cancelled() && steps.decide.outputs.mode != 'skip' }}
        env:
          MODE: ${{ steps.decide.outputs.mode }}
          REUSE: ${{ steps.decide.outputs.reuse }}
          BUILD: ${{ steps.build.outcome }}
          BUILD_S: ${{ steps.build.outputs.seconds }}
          DL_HIT: ${{ steps.dl.outputs.cache-hit }}
          DL_KEY: ${{ steps.dl.outputs.cache-matched-key }}
          DISK_BEFORE: ${{ steps.disk.outputs.before_gb }}
          DISK_START: ${{ steps.disk.outputs.start_gb }}
          DISK_END: ${{ steps.build.outputs.end_gb }}
        run: |
          image=buildroot/output/images/bzImage
          if [ "$MODE" = boot ]; then
            took="not built: reused the image from run [$REUSE]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$REUSE)"
          elif [ -n "$BUILD_S" ]; then
            took="$((BUILD_S / 60)) min $((BUILD_S % 60)) s ($BUILD_S s)"
          else
            took="didn't run"
          fi
          case $MODE:$DL_HIT in
          boot:*) dl="not used (no build)" ;;
          *:true) dl="exact hit, \`$DL_KEY\`" ;;
          *:false) dl="partial, restored from \`$DL_KEY\`" ;;
          *) dl="miss (cold)" ;;
          esac
          {
            echo "### Build"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Build | ${BUILD:-not run}, $took |"
            if [ -f "$image" ]; then
              echo "| \`bzImage\` | $(stat -c %s "$image") bytes |"
            else
              echo "| \`bzImage\` | none |"
            fi
            echo "| Download cache | $dl |"
            if [ "$MODE" = build ]; then
              echo "| Free disk | ${DISK_BEFORE:-?} GB at start, ${DISK_START:-?} GB before the build, ${DISK_END:-?} GB after |"
            fi
            echo
            echo "### Boots"
            echo
            if [ -s "$RUNNER_TEMP/boots.tsv" ]; then
              echo "| Case | Accelerator | Exit | Expected | Result |"
              echo "| --- | --- | --- | --- | --- |"
              while IFS=$'\t' read -r name accel rc want verdict; do
                echo "| \`$name\` | $accel | $rc | $want | $verdict |"
              done <"$RUNNER_TEMP/boots.tsv"
            else
              echo "No boots ran."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      # D49: kept 14 days, and public like the repository. Agents read
      # failures with gh run download <run-id> -n boot-logs.
      - name: Upload boot logs
        if: ${{ !cancelled() && steps.decide.outputs.mode != 'skip' }}
        uses: actions/upload-artifact@v7
        with:
          name: boot-logs
          path: |
            logs/ci/*.log
            !logs/ci/build.log
          retention-days: 14
          if-no-files-found: warn

      # Uploaded in boot mode too, so every run with a pass marker holds
      # the image it booted, for later boot-mode runs to fetch (D56).
      - name: Upload bzImage
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.fetch.outcome == 'success') }}
        uses: actions/upload-artifact@v7
        with:
          name: bzImage
          path: buildroot/output/images/bzImage
          retention-days: 14
          if-no-files-found: error

      # D56: only after all four boots passed, and every step above
      # succeeded, record that this image and boot test pass. A later run
      # with both fingerprints skips; one with the same image fingerprint
      # boots this run's bzImage; for as long as the marker is kept.
      - name: Write the pass marker
        if: steps.decide.outputs.mode != 'skip' && steps.decide.outputs.image_fp != '' && steps.decide.outputs.boot_fp != ''
        env:
          IMAGE_FP: ${{ steps.decide.outputs.image_fp }}
          BOOT_FP: ${{ steps.decide.outputs.boot_fp }}
          MODE: ${{ steps.decide.outputs.mode }}
        run: |
          printf 'image=%s\nboot=%s\nmode=%s\ncommit=%s\nrun=%s\n' "$IMAGE_FP" \
            "$BOOT_FP" "$MODE" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            >"$RUNNER_TEMP/build-and-boot-passed.txt"

      - name: Upload the pass marker
        if: steps.decide.outputs.mode != 'skip' && steps.decide.outputs.image_fp != '' && steps.decide.outputs.boot_fp != ''
        uses: actions/upload-artifact@v7
        with:
          name: build-and-boot-passed-${{ steps.decide.outputs.image_fp }}-${{ steps.decide.outputs.boot_fp }}
          path: ${{ runner.temp }}/build-and-boot-passed.txt
          retention-days: 14
          if-no-files-found: error
