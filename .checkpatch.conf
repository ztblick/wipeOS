# Options for the kernel's checkpatch.pl, as run by scripts/lint.sh.
# WipeOS C is userspace code written in Linux kernel style, so we keep
# kernel style checks and turn off only the ones that assume the kernel
# tree or kernel-only APIs. Each --ignore says why.

--no-tree
--no-signoff
--show-types
--color=never

# Linux coding-style.rst: 80 columns is the preferred limit. checkpatch
# itself only warns past 100.
--max-line-length=80

# The kernel requires an SPDX line in every file. WipeOS has not picked
# a license yet; turn this back on when it does.
--ignore SPDX_LICENSE_TAG

# Suggest kernel-only macros (__printf, ARRAY_SIZE) that don't exist in
# userspace headers.
--ignore PREFER_DEFINED_ATTRIBUTE_MACRO
--ignore ARRAY_SIZE

# Kernel log-message convention (use __func__ in printk strings).
--ignore EMBEDDED_FUNCTION_NAME

# Patch mode asks whether MAINTAINERS needs updating for new files.
--ignore FILE_PATH_CHANGES
